<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHAGGY MOVIES</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#09070a;--card:#15101a;--line:#2a2033;--red:#d4202e;--purple:#7c3aed;--txt:#f3eef6;--mute:#a79bb3}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--txt);font:400 15px/1.5 'DM Sans',system-ui,sans-serif;padding-bottom:40px}
button,input,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;padding:10px 14px;background:rgba(9,7,10,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font:700 22px Oswald,sans-serif;letter-spacing:1px;color:var(--red);white-space:nowrap}
.logo small{display:block;font:500 10px 'DM Sans';color:var(--mute);letter-spacing:0}
#q{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:9px 16px;outline:none}
#q:focus,.btn:focus-visible,input:focus,textarea:focus{outline:2px solid var(--purple)}
.btn{background:var(--red);border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:transparent;border:1px solid var(--line)}.btn.sm{padding:5px 10px;font-size:13px}
.hero{position:relative;min-height:300px;display:flex;align-items:flex-end;padding:22px 16px;background:#000 center/cover}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 8%,rgba(9,7,10,.35) 60%,rgba(124,58,237,.18))}
.hero div{position:relative;max-width:560px}
.hero h1{font:700 clamp(30px,8vw,54px)/1.05 Oswald;margin-bottom:6px}
.hero p{color:#d6cbe0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:12px}
main{padding:18px 14px;max-width:1200px;margin:auto}
h2{font:700 20px Oswald;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.card{cursor:pointer;background:var(--card);border-radius:10px;overflow:hidden;border:1px solid var(--line);transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--purple)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#1d1524}
.card b{display:block;padding:8px 9px 0;font-size:14px;line-height:1.25}
.card span{display:block;padding:0 9px 9px;font-size:12px;color:var(--mute)}
.star{color:#f5b73b}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.8);overflow:auto;padding:14px;display:none}
.modal.on{display:block}
.box{max-width:820px;margin:20px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.x{position:absolute;right:10px;top:10px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.7);cursor:pointer;font-size:18px}
.det{display:flex;gap:16px;padding:18px;flex-wrap:wrap}
.det img{width:160px;border-radius:8px;align-self:flex-start}
.det .in{flex:1;min-width:230px}
.det h3{font:700 28px/1.1 Oswald;margin-bottom:6px}
.meta{color:var(--mute);font-size:13px;margin-bottom:10px}
.tags span{display:inline-block;border:1px solid var(--line);border-radius:14px;padding:2px 10px;font-size:12px;margin:0 4px 4px 0;color:#d6cbe0}
.dl{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px}
.pad{padding:18px}
.pad input,.pad textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.row img{width:40px;border-radius:4px}.row .t{flex:1;min-width:0}
.err{color:#ff6b78;font-size:13px;margin-bottom:8px}
.empty{color:var(--mute);padding:30px 0;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header>
  <div class="logo">SHAGGY MOVIES<small>Movies • Series • Anime</small></div>
  <input id="q" type="search" placeholder="Search movies" aria-label="Search movies">
  <button class="btn alt sm" id="adm">Admin</button>
</header>
<div id="hero"></div>
<main><h2 id="ttl">Latest movies</h2><div class="grid" id="grid"></div>
<div style="text-align:center;margin-top:20px"><button class="btn alt" id="more" hidden>Load more</button></div></main>
<div class="modal" id="m"><div class="box" id="mb"></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token='';try{token=localStorage.getItem('sm_t')||''}catch{}
let page=1,pages=1,query='';
async function api(p,o={}){
  const r=await fetch('/api'+p,{...o,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:o.body?JSON.stringify(o.body):undefined});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Something went wrong');return j;
}
const card=m=>`<div class="card" tabindex="0" onclick="openMovie('${m._id}')" onkeydown="if(event.key==='Enter')openMovie('${m._id}')"><img loading="lazy" src="${esc(m.poster)}" alt="${esc(m.title)}"><b>${esc(m.title)}</b><span>${esc(m.year)} <i class="star">★</i> ${m.rating||'–'}</span></div>`;
async function load(reset=true){
  if(reset){page=1;$('#grid').innerHTML=''}
  try{
    const d=await api(`/movies?q=${encodeURIComponent(query)}&page=${page}`);pages=d.pages;
    if(reset){
      const h=d.items.find(x=>x.backdrop);
      $('#hero').innerHTML=!query&&h?`<div class="hero" style="background-image:url('${esc(h.backdrop)}')"><div><h1>${esc(h.title)}</h1><p>${esc(h.overview)}</p><button class="btn" onclick="openMovie('${h._id}')">Watch & download</button></div></div>`:'';
      $('#ttl').textContent=query?`Results for "${query}"`:'Latest movies';
      if(!d.items.length)$('#grid').innerHTML='<p class="empty" style="grid-column:1/-1">No movies yet. Add some from the admin panel.</p>';
    }
    if(d.items.length)$('#grid').insertAdjacentHTML('beforeend',d.items.map(card).join(''));
    $('#more').hidden=page>=pages;
  }catch(e){$('#grid').innerHTML=`<p class="empty" style="grid-column:1/-1">${esc(e.message)}</p>`}
}
$('#more').onclick=()=>{page++;load(false)};
let t;$('#q').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{query=e.target.value.trim();load()},350)};
function show(html){$('#mb').innerHTML='<button class="x" onclick="hide()" aria-label="Close">✕</button>'+html;$('#m').classList.add('on')}
function hide(){$('#m').classList.remove('on')}
$('#m').onclick=e=>{if(e.target.id==='m')hide()};
document.onkeydown=e=>{if(e.key==='Escape')hide()};
async function openMovie(id){
  show('<p class="empty">Loading…</p>');
  try{
    const m=await api('/movies/'+id),x=m.extra||{};
    show(`<div class="det"><img src="${esc(m.poster)}" alt=""><div class="in"><h3>${esc(m.title)}</h3>
    <div class="meta">${esc(m.year)}${m.runtime?' · '+m.runtime+' min':''} · <span class="star">★</span> ${m.rating||'–'}${x.imdb&&x.imdb!=='N/A'?' · IMDb '+esc(x.imdb):''}${x.rated&&x.rated!=='N/A'?' · '+esc(x.rated):''}</div>
    <div class="tags">${(m.genres||[]).map(g=>`<span>${esc(g)}</span>`).join('')}</div>
    <p style="margin:8px 0">${esc(m.overview)}</p>
    ${m.cast?.length?`<p class="meta"><b>Cast:</b> ${m.cast.map(esc).join(', ')}</p>`:''}
    ${x.director&&x.director!=='N/A'?`<p class="meta"><b>Director:</b> ${esc(x.director)}</p>`:''}
    ${x.awards&&x.awards!=='N/A'?`<p class="meta"><b>Awards:</b> ${esc(x.awards)}</p>`:''}
    <div class="dl">${m.trailer?`<a class="btn alt" target="_blank" rel="noopener" href="${esc(m.trailer)}">Trailer</a>`:''}
    ${(m.downloads||[]).map(d=>`<a class="btn" target="_blank" rel="noopener" href="${esc(d.url)}">Download ${esc(d.label)}</a>`).join('')||'<span class="meta">Download links coming soon.</span>'}</div></div></div>`);
  }catch(e){show(`<p class="empty">${esc(e.message)}</p>`)}
}
// ---------- admin ----------
$('#adm').onclick=()=>token?panel():loginView();
function loginView(err=''){
  show(`<div class="pad"><h2>Admin login</h2>${err?`<p class="err">${esc(err)}</p>`:''}
  <input id="lu" placeholder="Username" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocomplete="current-password">
  <button class="btn" id="lb">Log in</button></div>`);
  const go=async()=>{try{const r=await api('/login',{method:'POST',body:{user:$('#lu').value,pass:$('#lp').value}});token=r.token;try{localStorage.setItem('sm_t',token)}catch{}panel()}catch(e){loginView(e.message)}};
  $('#lb').onclick=go;$('#lp').onkeydown=e=>{if(e.key==='Enter')go()};
}
async function panel(msg=''){
  let list=[];
  try{list=await api('/admin/movies')}catch(e){token='';try{localStorage.removeItem('sm_t')}catch{}return loginView('Session ended. Log in again.')}
  show(`<div class="pad"><div class="row" style="border:0"><h2 style="flex:1;margin:0">Admin panel</h2><button class="btn alt sm" onclick="logout()">Log out</button></div>
  ${msg?`<p class="meta">${esc(msg)}</p>`:''}
  <h2 style="margin-top:14px">Add a movie</h2>
  <div style="display:flex;gap:8px"><input id="as" placeholder="Search by title" style="margin:0"><button class="btn" id="ab">Search</button></div>
  <div id="ar"></div>
  <h2 style="margin-top:20px">On the site (${list.length})</h2>
  ${list.map(m=>`<div class="row"><img src="${esc(m.poster)}" alt=""><div class="t"><b>${esc(m.title)}</b> <span class="meta">${esc(m.year)} · ${m.downloads.length} links</span></div>
  <button class="btn alt sm" onclick="feat('${m._id}',${!m.featured})">${m.featured?'★ Featured':'☆ Feature'}</button>
  <button class="btn alt sm" onclick="editLinks('${m._id}')">Links</button>
  <button class="btn alt sm" onclick="del('${m._id}')">Delete</button></div><div id="e${m._id}"></div>`).join('')||'<p class="empty">Nothing added yet.</p>'}</div>`);
  const s=async()=>{
    $('#ar').innerHTML='<p class="meta">Searching…</p>';
    try{const r=await api('/admin/search?q='+encodeURIComponent($('#as').value));
      $('#ar').innerHTML=r.map(x=>`<div class="row"><img src="${esc(x.poster)}" alt=""><div class="t">${esc(x.title)} <span class="meta">${esc(x.year)}</span></div><button class="btn sm" onclick="add(${x.id},this)">Add</button></div>`).join('')||'<p class="meta">No results.</p>'}
    catch(e){$('#ar').innerHTML=`<p class="err">${esc(e.message)}</p>`}
  };
  $('#ab').onclick=s;$('#as').onkeydown=e=>{if(e.key==='Enter')s()};
}
async function add(id,b){b.disabled=true;b.textContent='Adding…';try{const m=await api('/admin/import',{method:'POST',body:{tmdbId:id}});await panel(`Added "${m.title}" with ${m.downloads.length} download links.`);load()}catch(e){b.textContent='Failed';alert(e.message)}}
async function feat(id,v){await api('/admin/movies/'+id,{method:'PUT',body:{featured:v}});panel();load()}
async function del(id){if(!confirm('Delete this movie?'))return;await api('/admin/movies/'+id,{method:'DELETE'});panel('Movie deleted.');load()}
async function editLinks(id){
  const el=$('#e'+id);if(el.innerHTML){el.innerHTML='';return}
  const m=(await api('/admin/movies')).find(x=>x._id===id);
  el.innerHTML=`<textarea id="t${id}" rows="4" placeholder="One per line: label | url">${esc(m.downloads.map(d=>d.label+' | '+d.url).join('\n'))}</textarea>
  <button class="btn sm" onclick="saveLinks('${id}')">Save links</button> <button class="btn alt sm" onclick="refetch('${id}')">Fetch from API</button>`;
}
async function saveLinks(id){
  const downloads=$('#t'+id).value.split('\n').map(l=>l.split('|').map(s=>s.trim())).filter(p=>p[1]||/^https?:/.test(p[0])).map(p=>p[1]?{label:p[0],url:p[1]}:{label:'Download',url:p[0]});
  await api('/admin/movies/'+id,{method:'PUT',body:{downloads}});panel('Links saved.');
}
async function refetch(id){try{const m=await api(`/admin/movies/${id}/links`,{method:'POST'});panel(`Fetched ${m.downloads.length} links.`)}catch(e){alert(e.message)}}
function logout(){token='';try{localStorage.removeItem('sm_t')}catch{}hide()}
load();
</script></body></html>
