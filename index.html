<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0710">
<!--SEO-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='10' fill='%23e11d48'/%3E%3Cpath d='M14 9.5v17l14-8.5z' fill='%23fff'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0710;--s1:#14101c;--s2:#1b1626;--line:#2b2238;--red:#e11d48;--pur:#7c3aed;--txt:#f5f1fa;--mute:#a79bb8;--grad:linear-gradient(135deg,#e11d48,#7c3aed)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font:400 15px/1.55 'DM Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}a{color:inherit}
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(10,7,16,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.ic{background:none;border:0;padding:6px;cursor:pointer;color:var(--txt);display:grid;place-items:center;border-radius:10px}.ic:active{background:var(--s2)}
.logo{display:flex;align-items:center;gap:9px;flex:1;text-decoration:none}
.logo b{display:block;font:700 22px/.95 Oswald,sans-serif;letter-spacing:1.5px}
.logo small{display:block;font:700 9px 'DM Sans';letter-spacing:5.5px;color:var(--red)}
.sr{display:none;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line)}.sr.on{display:block}
#q{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:11px 18px;outline:none}
#q:focus,.btn:focus-visible,.card:focus-visible,.chip:focus-visible{outline:2px solid var(--pur);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:7px 15px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.chip.on{background:var(--grad);border-color:transparent;font-weight:700}
.btn{background:var(--grad);border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 16px rgba(225,29,72,.25)}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.6}
.btn.alt{background:var(--s2);border:1px solid var(--line);box-shadow:none}.btn.sm{padding:7px 12px;font-size:13px}.btn.big{padding:12px 22px;font-size:16px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:55;display:none}.ov.on{display:block}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(84vw,330px);background:#000;z-index:60;transform:translateX(-100%);transition:transform .22s;overflow:auto}.drawer.on{transform:none}
.dh{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#0d0a10;border-bottom:1px solid var(--line)}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:17px 16px;background:none;border:0;border-bottom:1px solid #1d1524;font:700 17px 'DM Sans';text-align:left;cursor:pointer}
.mi .tg{margin-left:auto;width:26px;height:26px;border-radius:5px;background:#3a3340;display:grid;place-items:center;font-size:18px;line-height:1}
.sub{display:none;grid-template-columns:1fr 1fr;gap:2px 12px;padding:4px 16px 12px 24px;border-bottom:1px solid #1d1524}.sub.on{display:grid}
.sub button{background:none;border:0;text-align:left;padding:10px 0;color:#d6cbe0;font-size:16px;cursor:pointer}
.hero{position:relative;min-height:340px;display:flex;align-items:flex-end;padding:26px 16px;background:#000 center 20%/cover;margin-top:10px;border-radius:0}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 6%,rgba(10,7,16,.45) 55%,rgba(124,58,237,.2))}
.hero>div{position:relative;max-width:600px}
.hero small{display:inline-block;background:var(--grad);border-radius:6px;padding:2px 10px;font:700 11px 'DM Sans';letter-spacing:1px;margin-bottom:8px}
.hero h1{font:700 clamp(30px,8vw,56px)/1.05 Oswald;margin-bottom:8px}
.hero p{color:#d6cbe0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:14px}
main{padding:16px 14px;max-width:1200px;margin:auto}
h2.st{font:700 21px Oswald;margin-bottom:14px;display:flex;align-items:center;gap:10px}h2.st:before{content:"";width:5px;height:22px;border-radius:3px;background:var(--grad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.card{position:relative;display:block;text-decoration:none;background:var(--s1);border-radius:12px;overflow:hidden;border:1px solid var(--line);transition:transform .18s,border-color .18s,box-shadow .18s;animation:in .35s both}
.card:hover{transform:translateY(-4px);border-color:var(--pur);box-shadow:0 10px 26px rgba(124,58,237,.25)}
.card .im{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--s2)}
.card b{display:block;padding:9px 10px 0;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.card span{display:block;padding:2px 10px 10px;font-size:12px;color:var(--mute)}
.bd{position:absolute;top:8px;left:8px;background:var(--grad);border-radius:6px;padding:1px 8px;font:700 11px 'DM Sans';font-style:normal}
.rt{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.72);border-radius:6px;padding:1px 7px;font:700 12px 'DM Sans';color:#f5b73b}
.sk .im,.sk b,.sk span,.sk-l{background:linear-gradient(90deg,#1b1626 25%,#2a2238 50%,#1b1626 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:8px}
.sk b{height:14px;margin:10px;min-height:0;display:block}.sk span{height:10px;margin:0 10px 12px;width:50%}
.sk-l{height:16px;margin:10px 0}
@keyframes sh{to{background-position:-200% 0}}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.empty{color:var(--mute);padding:40px 0;text-align:center;grid-column:1/-1}
footer{padding:30px 16px 40px;text-align:center;color:var(--mute);font-size:13px;border-top:1px solid var(--line);margin-top:30px}
footer b{font:700 18px Oswald;color:var(--txt);letter-spacing:1px;display:block;margin-bottom:6px}
.page{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;display:none;overscroll-behavior:contain}.page.on{display:block;animation:in .25s both}
.bk{position:fixed;inset:0;background:center/cover;filter:blur(40px) brightness(.45) saturate(1.3);transform:scale(1.2);z-index:-1;opacity:.9}
.pgbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(180deg,rgba(10,7,16,.9),rgba(10,7,16,0))}
.pgbar b{font:700 16px Oswald;letter-spacing:1px}
.back{width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);font-size:24px;line-height:1;cursor:pointer}
.dt{max-width:860px;margin:0 auto;padding:6px 16px 60px}
.top{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
.pst{width:min(46vw,200px);aspect-ratio:2/3;object-fit:cover;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.6);background:var(--s2)}
.inf{flex:1;min-width:220px}
.dt h1{font:700 clamp(26px,6vw,40px)/1.08 Oswald;margin-bottom:10px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pills span{background:rgba(255,255,255,.1);border-radius:8px;padding:2px 10px;font-size:13px}.pills .r{background:rgba(245,183,59,.18);color:#f5b73b;font-weight:700}
.tags span{display:inline-block;border:1px solid var(--line);border-radius:14px;padding:2px 11px;font-size:12px;margin:0 5px 5px 0;color:#d6cbe0}
.dt p.ov{margin:16px 0 8px;color:#e6dff0}
.facts{color:var(--mute);font-size:14px;margin:12px 0}.facts b{color:var(--txt)}.facts div{margin-bottom:4px}
.dt h2{font:700 22px Oswald;margin:26px 0 12px;display:flex;align-items:center;gap:10px}.dt h2:before{content:"";width:5px;height:22px;border-radius:3px;background:var(--grad)}
.q{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.q .qh{flex:1;min-width:140px}.q .qh b{font:700 19px Oswald;display:block}.q .qh span{color:var(--mute);font-size:13px}
.q .qb{display:flex;flex-wrap:wrap;gap:8px}
.note{color:var(--mute);font-size:13px;margin:6px 0 12px}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.row .t{flex:1;min-width:0}
select.btn{appearance:none;padding-right:16px}
.ad{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;margin:16px 0;max-width:100%;overflow:hidden}.dt .ad{margin:28px 0}
.ad small{color:var(--mute);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:4px}.ad iframe{border:0;max-width:100%;background:transparent}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<header>
  <button class="ic" id="mb" aria-label="Menu"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  <a class="logo" href="/" aria-label="Shaggy Movies home">
    <svg width="36" height="36" viewBox="0 0 36 36"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e11d48"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><rect width="36" height="36" rx="10" fill="url(#g)"/><path d="M14 9.5v17l14-8.5z" fill="#fff"/><circle cx="8" cy="9" r="1.6" fill="#fff" opacity=".7"/><circle cx="8" cy="18" r="1.6" fill="#fff" opacity=".7"/><circle cx="8" cy="27" r="1.6" fill="#fff" opacity=".7"/></svg>
    <span><b>SHAGGY</b><small>MOVIES</small></span>
  </a>
  <button class="ic" id="sb" aria-label="Search"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button>
</header>
<div class="sr" id="sr"><input id="q" type="search" placeholder="Search movies, series and anime" aria-label="Search"></div>
<div class="chips" id="chips"></div>
<div class="ov" id="ov"></div>
<nav class="drawer" id="dr"><div class="dh"><b style="flex:1;font:700 18px Oswald;letter-spacing:1px">MENU</b><button class="ic" id="cl" aria-label="Close menu">✕</button></div><div id="dm"></div></nav>
<div id="hero"></div>
<main><h2 class="st" id="ttl">Latest</h2><div class="grid" id="grid"></div><div id="sent" style="height:1px"></div></main>
<footer><b>SHAGGY MOVIES</b>Movies, TV series and anime with Sinhala subtitles.<br>Pick a title, choose a quality and download.</footer>
<div class="page" id="pg"><div class="bk" id="bk"></div><div class="pgbar"><button class="back" onclick="closePg()" aria-label="Back">‹</button><b>SHAGGY MOVIES</b></div><div class="dt" id="pgb"></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ct=t=>String(t||'').replace(/\s*Sinhala Subtitles.*$/i,'').replace(/\s*\|.*$/,'').trim();
const yr=m=>/^\d{4}$/.test(String(m.year||'').trim())?String(m.year).trim():(String(m.title||'').match(/\((\d{4})\)/)||[])[1]||'';
const slug=t=>ct(t).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80)||'movie';
const DEF='SHAGGY MOVIES – Download movies, TV series & anime with Sinhala subtitles';
let ADS=true;const cfgP=api('/config').then(c=>{ADS=c.ads!==false}).catch(()=>{});
// Adsterra banners: 728x90 on wide screens, 160x300 on phones, each in its own lazy iframe so it never slows the page.
function adHtml(){
  if(!ADS)return '';
  const wide=innerWidth>=768,k=wide?'dddc590e36a17c3209db632d3d17cfc0':'7666b2eb78b35b8a2ac375767a90dc08',w=wide?728:160,h=wide?90:300;
  const doc=`<!doctype html><html><body style="margin:0;background:transparent"><script>atOptions={'key':'${k}','format':'iframe','height':${h},'width':${w},'params':{}};<\/script><script src="https://www.highrevenueformat.com/${k}/invoke.js"><\/script></body></html>`;
  return `<div class="ad"><small>Advertisement</small><iframe loading="lazy" width="${w}" height="${h}" scrolling="no" frameborder="0" title="Advertisement" srcdoc="${esc(doc)}"></iframe></div>`}
let page=1,pages=1,query='',F={},title='Latest',loading=false,seq=0;
async function api(p){const r=await fetch('/api'+p),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Something went wrong');return j}
function setMeta(t,d){document.title=t||DEF;const m=document.querySelector('meta[name=description]');if(m&&d)m.content=d}
// ---- menu + chips ----
let ACT=[];
const reg=(f,t)=>(ACT.push({f,t}),ACT.length-1);
async function buildMenu(){
  ACT=[];let gen=[];try{gen=await api('/genres')}catch{}
  const item=(i,t,f)=>`<button class="mi" onclick="go(${reg(f,t)})">${i} ${esc(t)}</button>`;
  const grp=(i,t,subs)=>`<button class="mi" onclick="tgl(this)">${i} ${esc(t)}<span class="tg">+</span></button><div class="sub">${subs.map(([n,f])=>`<button onclick="go(${reg(f,t+' · '+n)})">${esc(n)}</button>`).join('')}</div>`;
  $('#dm').innerHTML=item('🏠','Latest',{})+item('🎬','All Movies',{type:'movie'})
   +grp('📺','TV Shows',[['All',{type:'tv'}],['Complete',{type:'tv',status:'complete'}],['Incomplete',{type:'tv',status:'incomplete'}]])
   +item('🎌','Anime',{type:'anime'})+(gen.length?grp('🎭','Genres',gen.map(g=>[g,{genre:g}])):'')+item('⭐','Featured',{featured:1});
  const C=[['🔥 Latest',{},'Latest'],['🎬 Movies',{type:'movie'},'All Movies'],['📺 TV',{type:'tv'},'TV Shows'],['🎌 Anime',{type:'anime'},'Anime'],['⭐ Featured',{featured:1},'Featured'],...gen.slice(0,14).map(g=>[g,{genre:g},g])];
  $('#chips').innerHTML=C.map(([l,f,t])=>`<button class="chip" data-t="${esc(t)}" onclick="go(${reg(f,t)})">${esc(l)}</button>`).join('');
  markChip();
}
const markChip=()=>document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',!query&&c.dataset.t===title));
function tgl(b){const s=b.nextElementSibling;s.classList.toggle('on');b.querySelector('.tg').textContent=s.classList.contains('on')?'−':'+'}
const menu=on=>{$('#dr').classList.toggle('on',on);$('#ov').classList.toggle('on',on)};
$('#mb').onclick=()=>menu(true);$('#cl').onclick=$('#ov').onclick=()=>menu(false);
$('#sb').onclick=()=>{$('#sr').classList.toggle('on');if($('#sr').classList.contains('on'))$('#q').focus()};
function go(i){const a=ACT[i];F=a.f;title=a.t;query='';$('#q').value='';menu(false);scrollTo(0,0);load()}
// ---- listing ----
const skel=n=>Array(n).fill('<div class="card sk"><div class="im"></div><b></b><span></span></div>').join('');
const card=(m,i)=>`<a class="card" style="animation-delay:${(i%12)*30}ms" href="/m/${m._id}/${slug(m.title)}" onclick="return nav(event,'${m._id}')">${m.type==='tv'?'<i class="bd">TV</i>':m.type==='anime'?'<i class="bd">ANIME</i>':''}${m.rating?`<i class="rt">★ ${esc(String(m.rating).replace('/10',''))}</i>`:''}<img class="im" loading="lazy" decoding="async" src="/img/${m._id}" data-o="${esc(m.poster)}" onerror="imgFix(this)" alt="${esc(ct(m.title))}"><b>${esc(ct(m.title))}</b><span>${esc(yr(m))}</span></a>`;
function imgFix(i){i.onerror=null;if(i.dataset.o){i.referrerPolicy='no-referrer';i.src=i.dataset.o}}
function nav(e,id){if(e.metaKey||e.ctrlKey||e.shiftKey||e.button)return true;openMovie(id);return false}
async function load(reset=true){
  const my=++seq;if(!reset&&loading)return;loading=true;
  if(reset){page=1;$('#grid').innerHTML=skel(12);markChip()}
  try{
    const d=await api('/movies?'+new URLSearchParams({...F,q:query,page}));if(my!==seq)return;pages=d.pages;
    if(reset){
      $('#grid').innerHTML='';
      const h=!query&&!Object.keys(F).length?d.items.find(x=>x.type==='movie'&&x.poster):null;
      $('#hero').innerHTML=h?`<div class="hero" id="hr" style="background-image:url('/img/${h._id}')"><div><small>FEATURED</small><h1>${esc(ct(h.title))}</h1><p>${esc(h.overview)}</p><button class="btn big" onclick="openMovie('${h._id}')">⬇ Download now</button></div></div>`:'';
      if(h){const im=new Image();im.onerror=()=>{const el=$('#hr');if(el)el.style.backgroundImage=`url('${h.poster}')`};im.src='/img/'+h._id}
      $('#ttl').textContent=query?`Results for "${query}"`:title;
      if(!d.items.length)$('#grid').innerHTML='<p class="empty">Nothing here yet.</p>';
    }
    if(d.items.length){await cfgP;if(my!==seq)return;const cs=d.items.map((m,i)=>card(m,i));
      if(page===1&&cs.length>12)cs.splice(12,0,adHtml());else if(page>1&&page%3===0)cs.push(adHtml());
      $('#grid').insertAdjacentHTML('beforeend',cs.join(''))}
  }catch(e){if(my===seq)$('#grid').innerHTML=`<p class="empty">${esc(e.message)}</p>`}
  if(my===seq)loading=false;
}
new IntersectionObserver(e=>{if(e[0].isIntersecting&&!loading&&page<pages){page++;load(false)}},{rootMargin:'700px'}).observe($('#sent'));
let t;$('#q').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{query=e.target.value.trim();F={};title='Latest';load()},350)};
// ---- detail page ----
const pg=$('#pg'),pb=$('#pgb');
const idFromPath=()=>(location.pathname.match(/^\/m\/([0-9a-f]{24})/)||[])[1];
function pgShow(h){pb.innerHTML=h;pg.classList.add('on');document.body.style.overflow='hidden'}
function pgHide(){pg.classList.remove('on');document.body.style.overflow='';setMeta()}
function closePg(){if(history.state&&history.state.m&&!history.state.direct)history.back();else{history.replaceState(null,'','/');pgHide()}}
window.onpopstate=()=>{const id=idFromPath();id?openMovie(id,false):pgHide()};
document.onkeydown=e=>{if(e.key==='Escape'){if(pg.classList.contains('on'))closePg();menu(false)}};
const pgSkel='<div class="top"><div class="pst sk-l" style="height:300px"></div><div class="inf"><div class="sk-l" style="width:80%;height:34px"></div><div class="sk-l" style="width:50%"></div><div class="sk-l" style="width:60%"></div></div></div><div class="sk-l" style="height:70px;margin-top:20px"></div><div class="sk-l" style="height:64px"></div><div class="sk-l" style="height:64px"></div>';
const dlSkel='<div class="q sk"><div class="sk-l" style="width:100%;height:44px;margin:0"></div></div><div class="q sk"><div class="sk-l" style="width:100%;height:44px;margin:0"></div></div><p class="note">Getting your download links… this can take a few seconds.</p>';
function pageDl(l,u,m){return `<div class="q"><div class="qh"><b>${esc(l)}</b><span>Tap to get the download link</span></div><div class="qb"><button class="btn" data-u="${esc(u)}"${m?` data-m="${m}"`:''} onclick="getDl(this)">⬇ Download</button></div></div>`}
async function getDl(b){const o=b.textContent;b.disabled=true;b.textContent='Checking link…';
  try{const r=await api('/resolve?url='+encodeURIComponent(b.dataset.u)+(b.dataset.m?'&m='+b.dataset.m:''));showAlts(b,r);location.href=r.url}catch(e){alert(e.message)}
  b.disabled=false;b.textContent=o}
function showAlts(b,r){const host=b.closest('#dls,#eq')||b.parentElement;let el=host.querySelector('.alts');
  if(!el){el=document.createElement('div');el.className='alts';host.appendChild(el)}
  el.innerHTML=(r.alts||[]).length>1?'<p class="note">Link not working? Try another server:</p><div class="qb">'+r.alts.map(a=>`<a class="btn alt sm" target="_blank" rel="noopener" href="${esc(a.url)}">${esc(a.name)}</a>`).join('')+'</div>':''}
let S={};
function tvHtml(m){S={};m.episodes.forEach(e=>(S[e.season]=S[e.season]||[]).push(e));
  const ks=Object.keys(S);if(!ks.length)return '<p class="note">Episodes coming soon.</p>';
  return `<select id="ss" onchange="eps()" class="btn alt">${ks.map(k=>`<option value="${k}">Season ${k}</option>`).join('')}</select><div id="el"></div><div id="eq"></div>`}
function eps(){const s=$('#ss').value;$('#eq').innerHTML='';
  $('#el').innerHTML=(S[s]||[]).map((e,i)=>`<div class="row"><div class="t">Episode ${esc(e.number)} · ${esc(e.title)}</div><button class="btn sm" onclick="epq('${s}',${i},this)">⬇ Download</button></div>`).join('')}
async function epq(s,i,b){const e=S[s][i];b.disabled=true;
  try{const r=await api('/episode?url='+encodeURIComponent(e.url));
    $('#eq').innerHTML=`<p class="note">Episode ${esc(e.number)} – choose a quality:</p>`+(r.links.map(l=>pageDl(l.label,l.url)).join('')||'<p class="note">No links right now.</p>');
    $('#eq').scrollIntoView({behavior:'smooth',block:'nearest'})}catch(x){alert(x.message)}b.disabled=false}
function animeHtml(m){const e=m.episodes||[];if(!e.length)return '<p class="note">Episodes coming soon.</p>';
  return e.map((x,i)=>`<div class="row"><div class="t">Episode ${esc(x.number)} · ${esc(x.title)}</div><a class="btn sm" href="/dl/anime/${m._id}/${i}">⬇ Download</a></div>`).join('')}
async function loadLinks(id,quiet,data){
  const el=$('#dls');if(!el)return;
  try{const r=data||await api('/links/'+id);let h='';
    if(r.pages)h=r.pages.map(p=>pageDl(p.label,p.url,id)).join('');
    else{const G={};(r.links||[]).forEach(l=>{const k=(l.label.match(/\d{3,4}p/)||['Other'])[0];(G[k]=G[k]||{size:l.size,items:[]}).items.push(l)});
      h=Object.keys(G).map(k=>`<div class="q"><div class="qh"><b>${esc(k)}</b><span>${esc(G[k].size||'')}</span></div><div class="qb">${G[k].items.map(l=>`<a class="btn sm" target="_blank" rel="noopener" href="${esc(l.url)}">⬇ ${esc((l.label.match(/\[(.*?)\]/)||[0,'Download'])[1])}</a>`).join('')}</div></div>`).join('')}
    el.innerHTML=(h||'<p class="note">No links right now.</p>')+`<p class="note"><button class="btn alt sm" onclick="rl('${id}',this)">↻ Links not working? Refresh</button></p>`;
  }catch(e){if(!quiet)el.innerHTML=`<p class="note">${esc(e.message)}. Close and open again to retry.</p>`}
}
async function rl(id,b){const o=b.textContent;b.disabled=true;b.textContent='Refreshing…';
  try{const r=await fetch('/api/links/'+id+'/refresh',{method:'POST'}),j=await r.json();if(!r.ok)throw new Error(j.error||'Failed');loadLinks(id,true,j)}
  catch(e){alert(e.message);b.disabled=false;b.textContent=o}}
let OV={};
function rm(b){const f=b.dataset.f==='1';$('#ovt').textContent=f?OV.short:OV.full;b.dataset.f=f?'0':'1';b.textContent=f?'Read more':'Show less'}
async function openMovie(id,push=true){
  pgShow(pgSkel);pg.scrollTop=0;$('#bk').style.backgroundImage=`url('/img/${id}')`;
  try{
    const m=await api('/movies/'+id),meta=(k,l)=>m[k]?`<div><b>${l}:</b> ${esc(m[k])}</div>`:'';
    m.country=[...new Set(String(m.country||'').split(',').map(x=>x.trim()).filter(Boolean))].join(', ');
    await cfgP;
    const url='/m/'+id+'/'+slug(m.title);
    if(push)history.pushState({m:id},'',url);else if(!history.state)history.replaceState({m:id,direct:1},'',location.pathname);
    const ov=(m.overview||'').trim(),short=ov.length>230?ov.slice(0,230).replace(/\s+\S*$/,'')+'…':ov;OV={full:ov,short};
    setMeta(`${ct(m.title)} – Download | SHAGGY MOVIES`,short||`Download ${ct(m.title)} with Sinhala subtitles.`);
    const kind=({tv:'TV series',anime:'Anime'})[m.type]||'Movie';
    pgShow(`<div class="top"><img class="pst" src="/img/${m._id}" data-o="${esc(m.poster)}" onerror="imgFix(this)" alt="${esc(ct(m.title))}"><div class="inf"><h1>${esc(ct(m.title))}</h1>
      <div class="pills">${[yr(m),m.runtime,kind].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('')}${m.rating?`<span class="r">★ ${esc(m.rating)}</span>`:''}</div>
      <div class="tags">${(m.genres||[]).filter(g=>!/^[#.]/.test(g)).map(g=>`<span>${esc(g)}</span>`).join('')}</div>
      <button class="btn big" onclick="$('#dlh').scrollIntoView({behavior:'smooth'})">⬇ Download</button></div></div>
      ${ov?`<p class="ov" id="ovt">${esc(short)}</p>${ov.length>230?'<button class="btn alt sm" data-f="0" onclick="rm(this)">Read more</button>':''}`:''}
      <div class="facts">${m.cast?.length?`<div><b>Cast:</b> ${m.cast.map(esc).join(', ')}</div>`:''}${meta('director','Director')}${meta('country','Country')}</div>
      ${adHtml()}<h2 id="dlh">Download</h2><div id="dls">${m.type==='tv'?tvHtml(m):m.type==='anime'?animeHtml(m):dlSkel}</div>${innerWidth>=768?adHtml():''}`);
    if(m.type==='tv'&&$('#ss'))eps();
    if(m.type!=='tv'&&m.type!=='anime')loadLinks(id);
  }catch(e){pgShow(`<p class="empty">${esc(e.message)}</p>`)}
}
buildMenu();load();setMeta(document.title&&document.title!=='undefined'?document.title:'');
{const id=idFromPath();if(id)openMovie(id,false)}
</script></body></html>
