<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#050507" />
<meta name="description" content="SHAGGY MOVIES - Movies, Series and Anime." />
<meta property="og:title" content="SHAGGY MOVIES" />
<meta property="og:description" content="Movies • Series • Anime" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<title>SHAGGY MOVIES</title>
<style>
:root{--bg:#050507;--card:#101116;--card2:#15161c;--text:#f4f4f6;--muted:#999ba5;--red:#e50914;--red2:#ff2535;--gold:#ffc857;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.13);--radius:14px}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:"Inter",sans-serif;color:var(--text);background:radial-gradient(circle at 50% -15%,rgba(229,9,20,0.16),transparent 38%),linear-gradient(180deg,#09090c 0%,#050507 55%,#030304 100%);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E")}
a{color:inherit;text-decoration:none}
button{font-family:inherit;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
.hide{display:none!important}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:#050507}::-webkit-scrollbar-thumb{background:#292a31;border-radius:999px}::-webkit-scrollbar-thumb:hover{background:var(--red)}
::selection{background:var(--red);color:#fff}

nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;background:linear-gradient(180deg,rgba(5,5,7,0.96),rgba(5,5,7,0.82));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.logo{font-family:"Bebas Neue",sans-serif;font-size:26px;letter-spacing:2px;color:var(--red);transition:text-shadow .25s ease}
.logo:hover{text-shadow:0 0 15px rgba(229,9,20,.45),0 0 40px rgba(229,9,20,.18)}
.nav-links{display:flex;gap:20px;font-size:14px;color:var(--muted)}
.nav-links a:hover{color:#fff}
.nav-right{display:flex;align-items:center;gap:10px}
.search{display:flex;align-items:center;gap:10px;padding:8px 14px;min-width:220px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:12px;transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:rgba(229,9,20,.55);box-shadow:0 0 0 3px rgba(229,9,20,.07)}
.search input{background:transparent;border:none;outline:none;color:#fff;font-size:14px;width:100%}
.search input::placeholder{color:#777983}
.admin-btn{padding:8px 14px;font-size:13px;font-weight:600;border-radius:10px;color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);transition:background .2s}
.admin-btn:hover{background:rgba(229,9,20,.7)}

.hero{position:relative;min-height:68vh;padding:60px 24px;display:flex;align-items:flex-end;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,#050507 0%,rgba(5,5,7,.82) 25%,rgba(5,5,7,.35) 65%,rgba(5,5,7,.75) 100%),var(--hero-img,none) center/cover}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40%;z-index:-1;background:linear-gradient(0deg,#050507,transparent)}
.hero-content{max-width:700px;position:relative;z-index:2}
.hero-title{font-family:"Bebas Neue",sans-serif;font-size:clamp(3rem,9vw,7rem);line-height:.88;letter-spacing:2px;text-transform:uppercase;text-shadow:0 10px 35px rgba(0,0,0,.7);margin-top:14px}
.hero p{color:#c4c5cc;line-height:1.7;margin-top:16px;max-width:600px}
.hero-actions{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;background:rgba(229,9,20,.9);color:#fff;font-size:.7rem;font-weight:700;letter-spacing:.3px}
.btn-primary{padding:12px 26px;font-weight:600;font-size:14px;border-radius:10px;background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;box-shadow:0 10px 30px rgba(229,9,20,.22);transition:transform .2s,filter .2s,box-shadow .2s}
.btn-primary:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 15px 40px rgba(229,9,20,.38)}
.btn-primary:disabled{opacity:.6;cursor:wait}
.btn-secondary{padding:12px 26px;font-weight:600;font-size:14px;border-radius:10px;color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);transition:background .2s,transform .2s}
.btn-secondary:hover{background:rgba(255,255,255,.12);transform:translateY(-2px)}

.categories{display:flex;gap:8px;overflow-x:auto;padding:0 24px;margin-top:30px;scrollbar-width:none}
.categories::-webkit-scrollbar{display:none}
.categories button{flex-shrink:0;padding:9px 16px;color:var(--muted);background:rgba(255,255,255,.045);border:1px solid var(--border);border-radius:999px;font-size:13px;font-weight:500;transition:all .2s}
.categories button:hover{color:#fff;background:rgba(255,255,255,.09)}
.categories button.active{color:#fff;background:var(--red);border-color:var(--red);box-shadow:0 7px 20px rgba(229,9,20,.22)}

.section{padding:30px 24px}
.section-title{font-family:"Bebas Neue",sans-serif;font-size:clamp(1.7rem,3vw,2.3rem);letter-spacing:1px;text-transform:uppercase;margin-bottom:20px;display:flex;align-items:center;gap:12px}
.section-title::after{content:"";width:38px;height:3px;border-radius:999px;background:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px}
.card{position:relative;overflow:hidden;cursor:pointer;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 12px 35px rgba(0,0,0,.22);transition:transform .3s,border-color .3s,box-shadow .3s}
.card:hover{transform:translateY(-7px);border-color:rgba(229,9,20,.42);box-shadow:0 24px 55px rgba(0,0,0,.5),0 0 28px rgba(229,9,20,.08)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#111217;transition:transform .45s,filter .45s}
.card:hover img{transform:scale(1.045);filter:brightness(1.05)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.15) 60%,rgba(0,0,0,.92) 100%)}
.card-content{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:12px}
.card h3{font-size:.95rem;font-weight:700;line-height:1.35}
.card p{margin-top:5px;color:var(--muted);font-size:.78rem}
.rating{color:var(--gold);font-weight:700}
.year{color:var(--muted)}
.card .badge{position:absolute;top:10px;left:10px;z-index:3}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty h3{color:#fff;margin-bottom:8px;font-size:1.2rem}
.skeleton{aspect-ratio:2/3;border-radius:var(--radius);background:linear-gradient(90deg,#101116,#1a1b22,#101116);background-size:200% 100%;animation:shimmer 1.3s infinite}

footer{margin-top:60px;padding:45px 20px;border-top:1px solid var(--border);color:var(--muted);text-align:center;background:linear-gradient(180deg,transparent,rgba(0,0,0,.35))}
footer .logo{font-size:22px;margin-bottom:8px}
footer p{font-size:13px}

.modal{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:fadeIn .3s ease}
.modal.open{display:flex}
.modal-content{background:linear-gradient(180deg,#15161b,#0b0c10);border:1px solid var(--border2);border-radius:18px;box-shadow:0 30px 100px rgba(0,0,0,.7);max-width:100%;width:100%;max-height:90vh;overflow:auto;padding:24px;display:grid;grid-template-columns:220px 1fr;gap:24px;animation:slideUp .35s ease}
.modal-content img{border-radius:12px;width:100%}
.modal-content h2{font-family:"Bebas Neue",sans-serif;font-size:clamp(2rem,5vw,3rem);letter-spacing:1px;line-height:1}
.modal-content.player{display:block}
.modal-content video{width:100%;max-height:70vh;border-radius:12px;background:#000;margin-top:14px}
.modal-meta{color:var(--muted);margin-top:10px;font-size:14px}
.modal-desc{margin-top:16px;line-height:1.7;color:#c4c5cc}
.modal-actions{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.modal-close{position:absolute;top:16px;right:20px;font-size:26px;color:#fff;background:none;opacity:.6;transition:opacity .2s;z-index:5}
.modal-close:hover{opacity:1}
.modal-wrap{position:relative;width:100%;max-width:820px}

/* ADMIN PANEL */
.admin{position:fixed;inset:0;z-index:1100;display:none;overflow:auto;padding:20px;background:rgba(0,0,0,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.admin.open{display:block}
.admin-box{position:relative;max-width:900px;margin:20px auto;padding:26px;background:linear-gradient(180deg,#15161b,#0b0c10);border:1px solid var(--border2);border-radius:18px;box-shadow:0 30px 100px rgba(0,0,0,.7);animation:slideUp .35s ease}
.admin-box h2{font-family:"Bebas Neue",sans-serif;font-size:2rem;letter-spacing:1px}
.admin-box h3{font-family:"Bebas Neue",sans-serif;font-size:1.4rem;letter-spacing:1px;margin:24px 0 12px}
.login-box{max-width:380px;margin:0 auto;text-align:center}
.form{display:grid;gap:12px;margin-top:16px;text-align:left}
.form.two{grid-template-columns:1fr 1fr}
.form .full{grid-column:1/-1}
.form label{display:grid;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.form input,.form textarea{width:100%;padding:11px 13px;font:inherit;font-size:14px;color:#fff;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;outline:none;transition:border-color .2s}
.form input:focus,.form textarea:focus{border-color:rgba(229,9,20,.6)}
.form textarea{min-height:90px;resize:vertical}
.check{display:flex!important;align-items:center;gap:8px}
.check input{width:auto}
.err{color:#ff6b73;font-size:13px;min-height:18px}
.row-actions{display:flex;gap:10px;flex-wrap:wrap}
.admin-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-right:34px}
.alist{display:grid;gap:10px}
.arow{display:flex;align-items:center;gap:12px;padding:10px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px}
.arow img{width:42px;height:60px;object-fit:cover;border-radius:6px;background:#111217;flex-shrink:0}
.arow .info{flex:1;min-width:0}
.arow .info b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .info span{font-size:12px;color:var(--muted)}
.mini{padding:7px 12px;font-size:12px;font-weight:600;border-radius:8px;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.mini:hover{background:rgba(255,255,255,.16)}
.mini.del:hover{background:var(--red)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:2000;padding:12px 20px;font-size:14px;color:#fff;background:#1b1c23;border:1px solid var(--border2);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:all .3s}
.toast.show{opacity:1;transform:translateX(-50%)}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{to{background-position:-200% 0}}
.fade-in{animation:fadeInUp .5s ease both}

@media(max-width:900px){.hero{min-height:60vh}.grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:15px}.nav-links{display:none}.search{min-width:150px}}
@media(max-width:600px){body{font-size:14px}nav{padding:12px 16px;gap:8px}.logo{font-size:20px}.search{min-width:0;flex:1;padding:8px 10px}.hero{min-height:58vh;padding:40px 16px}.hero-title{font-size:clamp(2.5rem,15vw,4rem)}.section{padding:24px 16px}.categories{padding:0 16px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.card-content{padding:9px}.card h3{font-size:.83rem}.modal-content{grid-template-columns:1fr;padding:18px;gap:16px}.modal-content img{max-width:160px;margin:0 auto}.btn-primary,.btn-secondary{padding:10px 20px}.form.two{grid-template-columns:1fr}.admin{padding:10px}.admin-box{padding:18px;margin:10px auto}}
@media(max-width:360px){.grid{gap:9px}.card h3{font-size:.78rem}}
</style>
</head>
<body>

<nav>
  <div style="display:flex;align-items:center;gap:24px;">
    <a href="#" class="logo" data-nav="All">SHAGGY MOVIES</a>
    <div class="nav-links">
      <a href="#" data-nav="All">Home</a>
      <a href="#" data-nav="Movies">Movies</a>
      <a href="#" data-nav="Series">Series</a>
      <a href="#" data-nav="Anime">Anime</a>
    </div>
  </div>
  <div class="nav-right">
    <div class="search">
      <span style="color:#999ba5;">🔍</span>
      <input id="searchInput" type="text" placeholder="Search movies..." aria-label="Search" />
    </div>
    <button class="admin-btn" id="adminBtn">Admin</button>
  </div>
</nav>

<section class="hero" id="hero">
  <div class="hero-content">
    <span class="badge">🔥 FEATURED</span>
    <h1 class="hero-title" id="heroTitle">SHAGGY MOVIES</h1>
    <p id="heroDesc">Movies • Series • Anime</p>
    <div class="hero-actions">
      <button class="btn-primary" id="heroPlay">▶ Play Now</button>
      <button class="btn-secondary" id="heroInfo">ⓘ More Info</button>
    </div>
  </div>
</section>

<div class="categories" id="categories"></div>

<section class="section">
  <h2 class="section-title" id="sectionTitle">Trending Now</h2>
  <div class="grid" id="grid"></div>
  <div class="empty hide" id="empty">
    <h3 id="emptyTitle">No results found</h3>
    <p id="emptyText">Try a different search or category.</p>
  </div>
</section>

<footer>
  <div class="logo">SHAGGY MOVIES</div>
  <p>Movies • Series • Anime</p>
  <p style="margin-top:12px;font-size:12px;">© <span id="year"></span> SHAGGY MOVIES. All rights reserved.</p>
</footer>

<div class="modal" id="modal">
  <div class="modal-wrap">
    <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
    <div class="modal-content" id="modalContent"></div>
  </div>
</div>

<!-- ADMIN PANEL (same page) -->
<div class="admin" id="admin">
  <div class="admin-box">
    <button class="modal-close" id="adminClose" aria-label="Close admin">✕</button>

    <div id="adminLogin" class="login-box">
      <h2>Admin Login</h2>
      <form class="form" id="loginForm">
        <label>Username<input id="lUser" autocomplete="username" required /></label>
        <label>Password<input id="lPass" type="password" autocomplete="current-password" required /></label>
        <p class="err" id="loginErr"></p>
        <button class="btn-primary" id="loginBtn">Login</button>
      </form>
    </div>

    <div id="adminDash" class="hide">
      <div class="admin-top"><h2>Admin Panel</h2><button class="mini" id="logoutBtn">Logout</button></div>
      <h3 id="formTitle">Add Movie</h3>
      <form class="form two" id="movieForm">
        <input type="hidden" id="fId" />
        <label class="full">Title<input id="fTitle" maxlength="120" required /></label>
        <label>Year<input id="fYear" type="number" min="1888" max="2100" required /></label>
        <label>Rating (0-10)<input id="fRating" type="number" step="0.1" min="0" max="10" required /></label>
        <label class="full">Category<input id="fCategory" list="catList" maxlength="40" placeholder="Action, Series, Anime..." required /></label>
        <datalist id="catList"></datalist>
        <label class="full">Poster image link<input id="fPoster" type="url" placeholder="https://..." required /></label>
        <label class="full">Video link (optional, .mp4 plays inside the site)<input id="fVideo" type="url" placeholder="https://..." /></label>
        <label class="full">Description<textarea id="fDesc" maxlength="1000"></textarea></label>
        <label class="check full"><input id="fFeatured" type="checkbox" /> Show as featured on the home banner</label>
        <p class="err full" id="formErr"></p>
        <div class="row-actions full">
          <button class="btn-primary" id="saveBtn">Save</button>
          <button type="button" class="btn-secondary hide" id="cancelEdit">Cancel edit</button>
        </div>
      </form>
      <h3>All Movies (<span id="countAll">0</span>)</h3>
      <div class="alist" id="adminList"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const FALLBACK = "data:image/svg+xml;utf8," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='400' height='600'><rect width='100%' height='100%' fill='#15161c'/><text x='50%' y='50%' fill='#555' font-family='sans-serif' font-size='28' text-anchor='middle'>No Image</text></svg>");
const IMG = (src, alt) => `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" onerror="this.onerror=null;this.src=FALLBACK" />`;

let MOVIES = [], currentCategory = "All", currentSearch = "", heroMovie = null;
let token = sessionStorage.getItem("sm_token") || "";

async function api(path, opts = {}) {
  const res = await fetch("/api" + path, {
    ...opts,
    headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || "Request failed"); e.status = res.status; throw e; }
  return data;
}
let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ---------- public site ---------- */
const isMovie = (m) => !["Series", "Anime"].includes(m.category);
const categories = () => ["All", ...new Set(MOVIES.map((m) => m.category))];

function renderCategories() {
  $("categories").innerHTML = categories().map((c) => `<button class="${c === currentCategory ? "active" : ""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
  $("catList").innerHTML = categories().slice(1).map((c) => `<option value="${esc(c)}">`).join("");
}
function renderHero() {
  heroMovie = MOVIES.find((m) => m.featured) || MOVIES[0] || null;
  if (!heroMovie) return;
  $("heroTitle").textContent = heroMovie.title;
  $("heroDesc").textContent = heroMovie.desc;
  $("hero").style.setProperty("--hero-img", `url("${heroMovie.poster.replace(/["\\]/g, "")}")`);
}
function renderGrid() {
  const s = currentSearch.toLowerCase();
  const list = MOVIES.filter((m) => {
    const catOk = currentCategory === "All" || (currentCategory === "Movies" ? isMovie(m) : m.category === currentCategory);
    return catOk && (!s || m.title.toLowerCase().includes(s));
  });
  $("sectionTitle").textContent = currentCategory === "All" ? (currentSearch ? `Results for "${currentSearch}"` : "Trending Now") : currentCategory;
  $("empty").classList.toggle("hide", list.length > 0);
  $("grid").innerHTML = list.map((m) => `
    <div class="card fade-in" data-id="${esc(m.id)}">
      <span class="badge">${esc(m.category)}</span>
      ${IMG(m.poster, m.title)}
      <div class="card-content"><h3>${esc(m.title)}</h3>
        <p><span class="year">${esc(m.year)}</span> • <span class="rating">★ ${esc(m.rating)}</span></p></div>
    </div>`).join("");
}
function renderAll() { renderCategories(); renderHero(); renderGrid(); renderAdminList(); }

async function loadMovies() {
  $("grid").innerHTML = Array.from({ length: 8 }, () => '<div class="skeleton"></div>').join("");
  try { MOVIES = await api("/movies"); renderAll(); }
  catch (e) {
    $("grid").innerHTML = "";
    $("emptyTitle").textContent = "Could not load movies";
    $("emptyText").textContent = "Please refresh the page in a moment.";
    $("empty").classList.remove("hide");
  }
}

function openModal(html, player) {
  $("modalContent").className = "modal-content" + (player ? " player" : "");
  $("modalContent").innerHTML = html;
  $("modal").classList.add("open"); document.body.style.overflow = "hidden";
}
function closeModal() { $("modal").classList.remove("open"); $("modalContent").innerHTML = ""; document.body.style.overflow = ""; }

function openMovie(id) {
  const m = MOVIES.find((x) => x.id === id); if (!m) return;
  openModal(`${IMG(m.poster, m.title)}
    <div><h2>${esc(m.title)}</h2>
      <p class="modal-meta">${esc(m.year)} • <span class="rating">★ ${esc(m.rating)}</span> • ${esc(m.category)}</p>
      <p class="modal-desc">${esc(m.desc)}</p>
      <div class="modal-actions">
        <button class="btn-primary" data-play="${esc(m.id)}">▶ Play</button>
        <button class="btn-secondary" id="closeBtn2">Close</button>
      </div></div>`);
}
function playMovie(id) {
  const m = MOVIES.find((x) => x.id === id); if (!m) return;
  if (!m.videoUrl) return toast("No video has been added for this title yet");
  if (/\.(mp4|webm|ogg)(\?.*)?$/i.test(m.videoUrl)) {
    openModal(`<h2>${esc(m.title)}</h2><video src="${esc(m.videoUrl)}" controls autoplay playsinline></video>`, true);
  } else window.open(m.videoUrl, "_blank", "noopener");
}

$("grid").addEventListener("click", (e) => { const c = e.target.closest(".card"); if (c) openMovie(c.dataset.id); });
$("categories").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { currentCategory = b.dataset.cat; renderCategories(); renderGrid(); } });
document.querySelectorAll("[data-nav]").forEach((a) => a.addEventListener("click", (e) => {
  e.preventDefault(); currentCategory = a.dataset.nav; currentSearch = ""; $("searchInput").value = "";
  renderCategories(); renderGrid(); window.scrollTo({ top: 0, behavior: "smooth" });
}));
$("modalContent").addEventListener("click", (e) => {
  const p = e.target.closest("[data-play]"); if (p) playMovie(p.dataset.play);
  if (e.target.id === "closeBtn2") closeModal();
});
$("modal").addEventListener("click", (e) => { if (e.target === $("modal")) closeModal(); });
$("modalClose").onclick = closeModal;
$("heroPlay").onclick = () => heroMovie && playMovie(heroMovie.id);
$("heroInfo").onclick = () => heroMovie && openMovie(heroMovie.id);
$("searchInput").addEventListener("input", (e) => { currentSearch = e.target.value.trim(); renderGrid(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeModal(); closeAdmin(); } });
$("year").textContent = new Date().getFullYear();

/* ---------- admin panel ---------- */
function showAdminView() {
  $("adminLogin").classList.toggle("hide", !!token);
  $("adminDash").classList.toggle("hide", !token);
  if (token) renderAdminList();
}
function openAdmin() { $("admin").classList.add("open"); document.body.style.overflow = "hidden"; showAdminView(); }
function closeAdmin() { $("admin").classList.remove("open"); document.body.style.overflow = ""; if (location.hash === "#admin") history.replaceState(null, "", location.pathname); }
function logout(msg) { token = ""; sessionStorage.removeItem("sm_token"); showAdminView(); if (msg) toast(msg); }

$("adminBtn").onclick = openAdmin;
$("adminClose").onclick = closeAdmin;
$("logoutBtn").onclick = () => logout("Logged out");
if (location.hash === "#admin") openAdmin();

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault(); $("loginErr").textContent = ""; $("loginBtn").disabled = true;
  try {
    const r = await api("/login", { method: "POST", body: JSON.stringify({ username: $("lUser").value, password: $("lPass").value }) });
    token = r.token; sessionStorage.setItem("sm_token", token); $("lPass").value = ""; showAdminView(); toast("Welcome, admin");
  } catch (err) { $("loginErr").textContent = err.message; }
  $("loginBtn").disabled = false;
});

function renderAdminList() {
  $("countAll").textContent = MOVIES.length;
  $("adminList").innerHTML = MOVIES.map((m) => `
    <div class="arow">${IMG(m.poster, m.title)}
      <div class="info"><b>${esc(m.title)}${m.featured ? " ⭐" : ""}</b><span>${esc(m.year)} • ${esc(m.category)} • ★ ${esc(m.rating)}${m.videoUrl ? " • video ✓" : ""}</span></div>
      <button class="mini" data-act="edit" data-id="${esc(m.id)}">Edit</button>
      <button class="mini del" data-act="del" data-id="${esc(m.id)}">Delete</button>
    </div>`).join("");
}
function resetForm() {
  $("movieForm").reset(); $("fId").value = ""; $("formTitle").textContent = "Add Movie";
  $("cancelEdit").classList.add("hide"); $("formErr").textContent = "";
}
$("cancelEdit").onclick = resetForm;

$("adminList").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const m = MOVIES.find((x) => x.id === b.dataset.id); if (!m) return;
  if (b.dataset.act === "edit") {
    $("fId").value = m.id; $("fTitle").value = m.title; $("fYear").value = m.year; $("fRating").value = m.rating;
    $("fCategory").value = m.category; $("fPoster").value = m.poster; $("fVideo").value = m.videoUrl || "";
    $("fDesc").value = m.desc || ""; $("fFeatured").checked = !!m.featured;
    $("formTitle").textContent = "Edit Movie"; $("cancelEdit").classList.remove("hide");
    $("movieForm").scrollIntoView({ behavior: "smooth", block: "start" });
  } else if (confirm(`Delete "${m.title}"?`)) {
    try { await api("/movies/" + m.id, { method: "DELETE" }); toast("Deleted"); await loadMovies(); }
    catch (err) { err.status === 401 ? logout("Session expired, please log in") : toast(err.message); }
  }
});

$("movieForm").addEventListener("submit", async (e) => {
  e.preventDefault(); $("formErr").textContent = ""; $("saveBtn").disabled = true;
  const id = $("fId").value;
  const body = JSON.stringify({
    title: $("fTitle").value, year: $("fYear").value, rating: $("fRating").value, category: $("fCategory").value,
    poster: $("fPoster").value, videoUrl: $("fVideo").value, desc: $("fDesc").value, featured: $("fFeatured").checked,
  });
  try {
    await api(id ? "/movies/" + id : "/movies", { method: id ? "PUT" : "POST", body });
    toast(id ? "Movie updated" : "Movie added"); resetForm(); await loadMovies();
  } catch (err) {
    if (err.status === 401) logout("Session expired, please log in"); else $("formErr").textContent = err.message;
  }
  $("saveBtn").disabled = false;
});

loadMovies();
</script>
</body>
</html>
