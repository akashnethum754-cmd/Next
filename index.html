<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07080b">
<title>SHAGGY MOVIES</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#07080b;
  --card:#11141a;
  --line:rgba(255,255,255,.08);
  --red:#e50914;
  --red2:#ff2633;
  --purple:#7c3aed;
  --txt:#f5f5f5;
  --mute:#969ba5;
  --yellow:#ffc857;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -10%,rgba(124,58,237,.08),transparent 35%),
    var(--bg);
  color:var(--txt);
  font:400 15px/1.5 'DM Sans',system-ui,sans-serif;
  padding-bottom:40px;
}

button,input{
  font:inherit;
  color:inherit;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:40;
  height:62px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 14px;
  background:rgba(7,8,11,.92);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.ic{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  border:0;
  border-radius:50%;
  background:transparent;
  cursor:pointer;
}

.ic:hover{
  background:rgba(255,255,255,.07);
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;
  flex:1;
  text-decoration:none;
  color:#fff;
  min-width:0;
}

.logo svg{
  flex:none;
}

.logo b{
  display:block;
  font:700 21px/.9 Oswald,sans-serif;
  letter-spacing:1.6px;
}

.logo small{
  display:block;
  margin-top:3px;
  font:700 8px 'DM Sans';
  letter-spacing:4.5px;
  color:#aaa;
}

/* SEARCH */

.sr{
  display:none;
  padding:10px 13px;
  background:#08090c;
  border-bottom:1px solid var(--line);
}

.sr.on{
  display:block;
}

.searchBox{
  position:relative;
}

.searchBox svg{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  color:#777;
}

#q{
  width:100%;
  height:44px;
  padding:0 14px 0 43px;
  background:#11141a;
  border:1px solid var(--line);
  border-radius:13px;
  outline:none;
}

#q:focus{
  border-color:rgba(229,9,20,.55);
  box-shadow:0 0 0 3px rgba(229,9,20,.08);
}

/* BUTTON */

.btn{
  min-height:37px;
  padding:8px 14px;
  border:0;
  border-radius:8px;
  background:var(--red);
  color:#fff;
  font-weight:700;
  cursor:pointer;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  transition:transform .15s,background .15s;
}

.btn:hover{
  background:var(--red2);
  transform:translateY(-1px);
}

.btn.alt{
  background:rgba(255,255,255,.045);
  border:1px solid var(--line);
  box-shadow:none;
}

.btn.sm{
  min-height:33px;
  padding:6px 10px;
  font-size:12px;
}

/* OVERLAY */

.ov{
  position:fixed;
  inset:0;
  z-index:55;
  display:none;
  background:rgba(0,0,0,.7);
}

.ov.on{
  display:block;
}

/* MENU */

.drawer{
  position:fixed;
  top:0;
  left:0;
  bottom:0;
  width:min(86vw,345px);
  z-index:60;
  background:#090a0d;
  border-right:1px solid var(--line);
  transform:translateX(-105%);
  transition:transform .22s ease;
  overflow:auto;
}

.drawer.on{
  transform:translateX(0);
}

.dh{
  height:62px;
  display:flex;
  align-items:center;
  padding:0 15px;
  border-bottom:1px solid var(--line);
}

.dh b{
  flex:1;
  font:600 19px Oswald;
  letter-spacing:1px;
}

.mi{
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  min-height:54px;
  padding:12px 16px;
  background:none;
  border:0;
  border-bottom:1px solid rgba(255,255,255,.045);
  color:#eee;
  font:600 15px 'DM Sans';
  text-align:left;
  cursor:pointer;
}

.mi:hover{
  background:rgba(229,9,20,.06);
}

.mi .tg{
  margin-left:auto;
  width:27px;
  height:27px;
  display:grid;
  place-items:center;
  border-radius:7px;
  background:rgba(255,255,255,.06);
  color:#aaa;
}

.sub{
  display:none;
  grid-template-columns:1fr 1fr;
  gap:2px 8px;
  padding:5px 16px 11px 43px;
  background:rgba(0,0,0,.2);
}

.sub.on{
  display:grid;
}

.sub button{
  background:none;
  border:0;
  text-align:left;
  padding:9px 0;
  color:#aaa;
  font-size:13px;
  cursor:pointer;
}

/* HERO */

.hero{
  position:relative;
  min-height:390px;
  display:flex;
  align-items:flex-end;
  padding:28px 16px 30px;
  background:#090a0d center/cover no-repeat;
  overflow:hidden;
}

.hero:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.9),
      rgba(0,0,0,.45) 55%,
      rgba(0,0,0,.1)
    ),
    linear-gradient(
      0deg,
      var(--bg),
      transparent 55%
    );
}

.hero div{
  position:relative;
  z-index:1;
  max-width:580px;
}

.hero h1{
  font:700 clamp(38px,9vw,65px)/.98 Oswald;
  margin-bottom:10px;
}

.hero p{
  color:#c8cbd0;
  font-size:13px;
  max-width:540px;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
  margin-bottom:17px;
}

/* MAIN */

main{
  max-width:1250px;
  margin:auto;
  padding:22px 14px;
}

.sectionHead{
  margin-bottom:15px;
}

h2{
  font:600 22px/1.1 Oswald;
}

.sectionLine{
  width:38px;
  height:2px;
  background:var(--red);
  border-radius:2px;
  margin-top:7px;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
  gap:17px 12px;
}

.card{
  position:relative;
  min-width:0;
  cursor:pointer;
  border-radius:9px;
  overflow:hidden;
  border:1px solid transparent;
  transition:transform .16s,border-color .16s;
}

.card:hover{
  transform:translateY(-4px);
  border-color:rgba(255,255,255,.12);
}

.card img{
  display:block;
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  background:#16181d;
  border-radius:8px;
  content-visibility:auto;
}

.card b{
  display:block;
  padding:8px 2px 0;
  font-size:13px;
  line-height:1.3;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.card span{
  display:block;
  padding:3px 2px 8px;
  color:#818792;
  font-size:11px;
}

.bd{
  position:absolute;
  z-index:2;
  top:6px;
  left:6px;
  background:var(--red);
  border-radius:5px;
  padding:3px 7px;
  font:700 9px 'DM Sans';
  font-style:normal;
}

.star{
  color:var(--yellow);
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:40px 0;
  color:#747a84;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:70;
  display:none;
  padding:10px;
  overflow:auto;
  background:rgba(0,0,0,.86);
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
}

.modal.on{
  display:block;
}

.box{
  position:relative;
  max-width:900px;
  margin:18px auto;
  background:#101318;
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 25px 70px rgba(0,0,0,.5);
}

.x{
  position:absolute;
  z-index:5;
  right:11px;
  top:11px;
  width:37px;
  height:37px;
  border-radius:50%;
  border:1px solid var(--line);
  background:rgba(0,0,0,.65);
  color:#fff;
  cursor:pointer;
}

.x:hover{
  background:var(--red);
}

/* DETAILS */

.det{
  display:flex;
  gap:21px;
  padding:22px;
  flex-wrap:wrap;
}

.det img{
  width:180px;
  aspect-ratio:2/3;
  object-fit:cover;
  align-self:flex-start;
  border-radius:9px;
  background:#181b20;
}

.det .in{
  flex:1;
  min-width:240px;
}

.det h3{
  font:700 clamp(27px,6vw,38px)/1.05 Oswald;
  margin-bottom:8px;
  padding-right:40px;
}

.meta{
  color:#9298a2;
  font-size:12px;
  margin-bottom:8px;
}

.meta b{
  color:#d9dbe0;
}

.tags{
  margin:9px 0;
}

.tags span{
  display:inline-block;
  padding:4px 9px;
  margin:0 4px 4px 0;
  border:1px solid var(--line);
  border-radius:20px;
  background:rgba(255,255,255,.025);
  color:#c5c8cf;
  font-size:10px;
}

#ov{
  color:#c5c8ce;
  font-size:13px;
  line-height:1.65;
}

/* DOWNLOAD */

.dl{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:15px;
  padding-top:15px;
  border-top:1px solid var(--line);
}

.downloadTitle{
  width:100%;
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:2px;
  font-weight:700;
}

.downloadTitle:before{
  content:"";
  width:4px;
  height:17px;
  border-radius:3px;
  background:var(--red);
}

.qualityGroup{
  width:100%;
  padding:11px;
  border:1px solid var(--line);
  border-radius:10px;
  background:rgba(255,255,255,.02);
}

.qualityLabel{
  margin-bottom:7px;
  color:#aaaeb7;
  font-size:11px;
  font-weight:700;
}

/* EPISODES */

.row{
  display:flex;
  gap:10px;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.row .t{
  flex:1;
  min-width:0;
  color:#c8cbd1;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

#eq{
  background:rgba(229,9,20,.035);
  border-radius:9px;
  padding:10px;
}

/* RESPONSIVE */

@media(min-width:700px){

  header{
    padding:0 25px;
  }

  main{
    padding:28px 23px;
  }

  .hero{
    min-height:500px;
    padding:45px 5vw 50px;
  }

  .grid{
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:20px 15px;
  }
}

@media(max-width:520px){

  header{
    height:58px;
    padding:0 9px;
  }

  .logo b{
    font-size:20px;
  }

  .logo small{
    font-size:7px;
  }

  .logo svg{
    width:32px;
    height:32px;
  }

  .hero{
    min-height:370px;
  }

  .hero h1{
    font-size:42px;
  }

  main{
    padding:19px 11px;
  }

  .grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:15px 8px;
  }

  .card b{
    font-size:11px;
  }

  .card span{
    font-size:9px;
  }

  .det{
    padding:17px;
    gap:15px;
  }

  .det img{
    width:125px;
  }

  .det .in{
    min-width:0;
  }

  .modal{
    padding:7px;
  }

  .box{
    margin:8px auto;
  }
}

@media(max-width:350px){

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(prefers-reduced-motion:reduce){

  *,
  *:before,
  *:after{
    transition:none!important;
    animation:none!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>

<body>

<header>

<button class="ic" id="mb" aria-label="Menu">
<svg width="25" height="25" viewBox="0 0 24 24" fill="none"
stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
<path d="M3 6h18M3 12h18M3 18h18"/>
</svg>
</button>

<a class="logo" href="/" aria-label="Shaggy Movies home">

<svg width="36" height="36" viewBox="0 0 36 36">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#e50914"/>
<stop offset="1" stop-color="#7c3aed"/>
</linearGradient>
</defs>

<rect width="36" height="36" rx="10" fill="url(#g)"/>
<path d="M14 9.5v17l14-8.5z" fill="#fff"/>
<circle cx="8" cy="9" r="1.6" fill="#fff" opacity=".7"/>
<circle cx="8" cy="18" r="1.6" fill="#fff" opacity=".7"/>
<circle cx="8" cy="27" r="1.6" fill="#fff" opacity=".7"/>
</svg>

<span>
<b>SHAGGY</b>
<small>MOVIES</small>
</span>

</a>

<button class="ic" id="sb" aria-label="Search">

<svg width="25" height="25" viewBox="0 0 24 24"
fill="none" stroke="currentColor" stroke-width="2.4"
stroke-linecap="round">

<circle cx="10.5" cy="10.5" r="6.5"/>
<path d="M15.5 15.5L21 21"/>

</svg>

</button>

</header>


<div class="sr" id="sr">

<div class="searchBox">

<svg width="18" height="18" viewBox="0 0 24 24"
fill="none" stroke="currentColor" stroke-width="2">

<circle cx="10.5" cy="10.5" r="6.5"/>
<path d="M15.5 15.5L21 21"/>

</svg>

<input
id="q"
type="search"
placeholder="Search movies, series..."
aria-label="Search">

</div>

</div>


<div class="ov" id="ov"></div>


<nav class="drawer" id="dr">

<div class="dh">

<b>MENU</b>

<button class="ic" id="cl" aria-label="Close menu">
✕
</button>

</div>

<div id="dm"></div>

</nav>


<div id="hero"></div>


<main>

<div class="sectionHead">

<div>
<h2 id="ttl">Latest</h2>
<div class="sectionLine"></div>
</div>

</div>

<div class="grid" id="grid"></div>

<div style="text-align:center;margin-top:25px">

<button class="btn alt" id="more" hidden>
Load more
</button>

</div>

</main>


<div class="modal" id="m">
<div class="box" id="mb2"></div>
</div>


<script>

const $=s=>document.querySelector(s);

const esc=s=>String(s??'').replace(
/[&<>"']/g,
c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c])
);

const ct=t=>String(t||'')
.replace(/\s*Sinhala Subtitles.*$/i,'')
.replace(/\s*\|.*$/,'')
.trim();


let page=1,
pages=1,
query='',
F={},
title='Latest';


async function api(p){

const r=await fetch('/api'+p);

const j=await r.json().catch(()=>({}));

if(!r.ok)
throw new Error(j.error||'Something went wrong');

return j;

}


/* MENU */

let ACT=[];

const reg=(f,t)=>(
ACT.push({f,t}),
ACT.length-1
);


async function buildMenu(){

ACT=[];

let gen=[];

try{
gen=await api('/genres');
}catch{}


const item=(i,t,f)=>
`<button class="mi" onclick="go(${reg(f,t)})">
${i} ${esc(t)}
</button>`;


const grp=(i,t,subs)=>
`<button class="mi" onclick="tgl(this)">
${i} ${esc(t)}
<span class="tg">+</span>
</button>
<div class="sub">
${subs.map(([n,f])=>
`<button onclick="go(${reg(f,t+' · '+n)})">
${esc(n)}
</button>`
).join('')}
</div>`;


$('#dm').innerHTML=
item('🏠','Latest',{})
+
item('🎬','All Movies',{type:'movie'})
+
grp('📺','TV Shows',[
['All',{type:'tv'}],
['Complete',{type:'tv',status:'complete'}],
['Incomplete',{type:'tv',status:'incomplete'}]
])
+
(
gen.length
?
grp(
'🎭',
'Genres',
gen.map(g=>[g,{genre:g}])
)
:
''
)
+
item('⭐','Featured',{featured:1});

}


function tgl(b){

const s=b.nextElementSibling;

s.classList.toggle('on');

b.querySelector('.tg').textContent=
s.classList.contains('on')?'−':'+';

}


const menu=on=>{

$('#dr').classList.toggle('on',on);
$('#ov').classList.toggle('on',on);

};


$('#mb').onclick=()=>menu(true);

$('#cl').onclick=
$('#ov').onclick=()=>menu(false);


$('#sb').onclick=()=>{

$('#sr').classList.toggle('on');

if($('#sr').classList.contains('on'))
$('#q').focus();

};


function go(i){

const a=ACT[i];

F=a.f;
title=a.t;
query='';
$('#q').value='';

menu(false);

scrollTo(0,0);

load();

}


/* CARD */

const card=m=>`

<div
class="card"
tabindex="0"
onclick="openMovie('${m._id}')"
onkeydown="if(event.key==='Enter')openMovie('${m._id}')">

${m.type==='tv'?'<i class="bd">TV</i>':''}

<img
loading="lazy"
decoding="async"
width="300"
height="450"
src="${esc(m.poster)}"
alt="${esc(ct(m.title))}"
onerror="this.style.opacity='.35'">

<b>${esc(ct(m.title))}</b>

<span>
${esc(m.year)}
<i class="star">★</i>
${esc(m.rating||'–')}
</span>

</div>

`;


/* FAST LIST */

async function load(reset=true){

if(reset){

page=1;

$('#grid').innerHTML='';

}


try{

const d=await api(
'/movies?'+
new URLSearchParams({
...F,
q:query,
page
})
);


/*
IMPORTANT:
Cards render immediately.
Hero waits until after the cards are inserted.
*/

if(reset){

$('#ttl').textContent=
query
?
`Results for "${query}"`
:
title;

$('#hero').innerHTML='';

}


if(d.items.length){

$('#grid').insertAdjacentHTML(
'beforeend',
d.items.map(card).join('')
);

}
else if(reset){

$('#grid').innerHTML=
'<p class="empty">Nothing here yet.</p>';

}


pages=d.pages;

$('#more').hidden=page>=pages;


/*
Hero is deliberately loaded AFTER cards.
This prevents the large hero image from delaying
the first visible movie cards.
*/

if(
reset &&
!query &&
!Object.keys(F).length
){

const h=d.items.find(
x=>x.type!=='tv'&&x.poster
);

if(h){

requestAnimationFrame(()=>{

const img=new Image();

img.decoding='async';

img.onload=()=>{

$('#hero').innerHTML=`

<div
class="hero"
style="background-image:url('${esc(h.poster)}')">

<div>

<h1>${esc(ct(h.title))}</h1>

<p>${esc(h.overview||'')}</p>

<button
class="btn"
onclick="openMovie('${h._id}')">

▶ Watch &amp; download

</button>

</div>

</div>

`;

};

img.onerror=()=>{

$('#hero').innerHTML='';

};

img.src=h.poster;

});

}

}


}catch(e){

$('#grid').innerHTML=
`<p class="empty">${esc(e.message)}</p>`;

}

}


$('#more').onclick=()=>{

page++;

load(false);

};


let t;

$('#q').oninput=e=>{

clearTimeout(t);

t=setTimeout(()=>{

query=e.target.value.trim();

F={};

title='Latest';

load();

},350);

};


/* MODAL */

function show(html){

$('#mb2').innerHTML=
'<button class="x" onclick="hide()" aria-label="Close">✕</button>'
+
html;

$('#m').classList.add('on');

}


function hide(){

$('#m').classList.remove('on');

}


$('#m').onclick=e=>{

if(e.target.id==='m')
hide();

};


document.onkeydown=e=>{

if(e.key==='Escape'){

hide();
menu(false);

}

};


/* DOWNLOAD */

function dlBtn(l,u){

return `
<button
class="btn sm"
data-u="${esc(u)}"
onclick="getDl(this)">

⬇ ${esc(l)}

</button>
`;

}


async function getDl(b){

const o=b.textContent;

b.disabled=true;
b.textContent='Getting link…';

try{

const r=
await api(
'/resolve?url='+
encodeURIComponent(b.dataset.u)
);

location.href=r.url;

}catch(e){

alert(e.message);

}

b.disabled=false;
b.textContent=o;

}


/* TV */

let S={};


function tvHtml(m){

S={};

m.episodes.forEach(
e=>
(S[e.season]=S[e.season]||[]).push(e)
);


const ks=Object.keys(S);

if(!ks.length)

return `
<p class="meta" style="margin-top:12px">
Episodes coming soon.
</p>
`;


return `

<div style="margin-top:18px">

<div class="downloadTitle">
Episodes
</div>

<select
id="ss"
onchange="eps()"
class="btn alt"
style="background:#11141a">

${ks.map(k=>
`<option value="${k}">
Season ${k}
</option>`
).join('')}

</select>

</div>

<div id="el"></div>

<div id="eq" class="dl" style="border:0"></div>

`;

}


function eps(){

const s=$('#ss').value;

$('#eq').innerHTML='';

$('#el').innerHTML=

(S[s]||[]).map((e,i)=>

`<div class="row">

<div class="t">
Episode ${esc(e.number)}
·
${esc(e.title)}
</div>

<button
class="btn sm"
onclick="epq('${s}',${i},this)">

⬇ Download

</button>

</div>`

).join('');

}


async function epq(s,i,b){

const e=S[s][i];

b.disabled=true;
b.textContent='Loading…';

try{

const r=
await api(
'/episode?url='+
encodeURIComponent(e.url)
);


$('#eq').innerHTML=

`<span
class="meta"
style="width:100%">

Episode ${esc(e.number)} download links

</span>`

+

(
r.links.map(
l=>dlBtn(l.label,l.url)
).join('')

||

'<span class="meta">
No links right now.
</span>'
);


$('#eq').scrollIntoView({
behavior:'smooth',
block:'nearest'
});

}catch(x){

alert(x.message);

}

b.disabled=false;
b.textContent='⬇ Download';

}


/* LINKS */

async function loadLinks(id,quiet){

const el=$('#dls');

if(!el)return;

try{

const r=await api('/links/'+id);

const G={};


r.links.forEach(l=>{

const k=
(l.label.match(/\d{3,4}p/)||['Other'])[0];

(
G[k]=
G[k]||
{
size:l.size,
items:[]
}
).items.push(l);

});


el.innerHTML=

`<div class="downloadTitle">
Download
</div>`

+

(

Object.keys(G).map(k=>

`<div class="qualityGroup">

<div class="qualityLabel">

${esc(k)}
${G[k].size?' · '+esc(G[k].size):''}

</div>

<div
class="dl"
style="
margin:0;
padding:0;
border:0">

${G[k].items.map(l=>

`<a
class="btn sm"
target="_blank"
rel="noopener"
href="${esc(l.url)}">

⬇
${esc(
(l.label.match(/\[(.*?)\]/)
||[0,'Download'])[1]
)}

</a>`

).join('')}

</div>

</div>`

).join('')

||

'<span class="meta">
No links right now.
</span>'

);


if(r.stale&&!quiet)

setTimeout(
()=>loadLinks(id,true),
10000
);


}catch(e){

if(!quiet)

el.innerHTML=
`<span class="meta">
${esc(e.message)}.
Close and open again to retry.
</span>`;

}

}


/* OVERVIEW */

let OV={};


function rm(b){

const f=b.dataset.f==='1';

$('#ov').textContent=
f
?
OV.short
:
OV.full;

b.dataset.f=
f
?
'0'
:
'1';

b.textContent=
f
?
'Read more'
:
'Show less';

}


/* DETAILS */

async function openMovie(id){

show('<p class="empty">Loading…</p>');

try{

const m=await api('/movies/'+id);


const meta=(k,l)=>
m[k]
?
`<p class="meta">
<b>${l}:</b> ${esc(m[k])}
</p>`
:
'';


m.country=[
...new Set(
String(m.country||'')
.split(',')
.map(x=>x.trim())
.filter(Boolean)
)
].join(', ');


const ov=(m.overview||'').trim();

const short=
ov.length>230
?
ov.slice(0,230)
.replace(/\s+\S*$/,'')
+'…'
:
ov;


OV={
full:ov,
short
};


show(`

<div class="det">

<img
src="${esc(m.poster)}"
alt="${esc(ct(m.title))}"
loading="eager"
decoding="async">

<div class="in">

<h3>
${esc(ct(m.title))}
</h3>

<div class="meta">

${
[
m.year,
m.runtime,
m.type==='tv'
?
'TV series'
:
'Movie',
m.rating
?
'★ '+m.rating
:
''
]
.filter(Boolean)
.map(esc)
.join(' · ')
}

</div>

<div class="tags">

${
(m.genres||[])
.filter(
g=>!/^[#.]/.test(g)
)
.map(
g=>`<span>${esc(g)}</span>`
)
.join('')
}

</div>

<p
style="margin:10px 0"
id="ov">

${esc(short)}

</p>

${
ov.length>230
?
`
<button
class="btn alt sm"
data-f="0"
onclick="rm(this)"
style="margin-bottom:9px">

Read more

</button>
`
:
''
}

${
m.cast?.length
?
`
<p class="meta">

<b>Cast:</b>
${m.cast.map(esc).join(', ')}

</p>
`
:
''
}

${meta('director','Director')}

${meta('country','Country')}

${
m.type==='tv'
?
tvHtml(m)
:
`
<div
class="dl"
id="dls">

<span class="meta">
Getting download links…
the first time can take a few seconds.
</span>

</div>
`
}

</div>

</div>

`);


if(m.type==='tv'&&$('#ss'))
eps();

if(m.type!=='tv')
loadLinks(id);

}catch(e){

show(
`<p class="empty">
${esc(e.message)}
</p>`
);

}

}


/* START */

buildMenu();
load();

</script>

</body>
</html>
